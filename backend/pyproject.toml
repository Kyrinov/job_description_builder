[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-builder-backend"
version = "0.1.0"
description = "JD Builder — FastAPI JSON API + Pydantic v2 + SQLite"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Conservative on first adoption: pyflakes (F) + a subset of pycodestyle errors
# (E). Import sorting (I) and `ruff format` are intentionally left off for now to
# avoid a large mechanical diff; enable once the team opts in.
select = ["E4", "E7", "E9", "F"]
