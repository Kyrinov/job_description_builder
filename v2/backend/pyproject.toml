[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-builder-v2-backend"
version = "0.1.0"
description = "JD Builder v2.0 — FastAPI JSON API + Pydantic v2 + SQLite"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
