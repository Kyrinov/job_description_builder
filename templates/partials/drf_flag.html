<div class="drf-dnd-toggle" id="drf-dnd-section">
    <p>Is this a DND (Department of National Defence) position?</p>
    <button
        type="button"
        class="button {% if is_dnd_position %}button--primary{% else %}button--secondary{% endif %} drf-toggle-btn"
        hx-post="/api/drf-links/{{ wd_id }}/flag-dnd"
        hx-vals='{"is_dnd": "{% if is_dnd_position %}false{% else %}true{% endif %}"}'
        hx-target="#drf-dnd-section"
        hx-swap="outerHTML"
        hx-indicator="#drf-flag-spinner">
        {% if is_dnd_position %}DND Position (click to unset){% else %}Set as DND Position{% endif %}
    </button>
    <span id="drf-flag-spinner" class="htmx-indicator" aria-label="Updating">Updating…</span>
</div>
