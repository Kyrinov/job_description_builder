<div id="drf-candidates-result" role="status">
    {% if candidates %}
    <form
        hx-post="/api/drf-links/{{ wd_id }}/confirm"
        hx-target="#drf-candidates-result"
        hx-swap="innerHTML"
        hx-indicator="#drf-confirm-spinner">
        <input type="hidden" name="wd_id" value="{{ wd_id }}">
        <p>{{ candidates|length }} candidate(s) found. Select the linkages that apply:</p>
        <ul class="drf-candidate-list">
        {% for c in candidates %}
            <li class="drf-candidate-item">
                <label>
                    <input type="checkbox" name="candidate_ids[]" value="{{ c.id }}"
                           {% if loop.first %}checked{% endif %}>
                    <strong>{{ c.core_responsibility }}</strong>:
                    {{ c.departmental_result }}
                    <span class="drf-fiscal-year">({{ c.fiscal_year }})</span>
                    <span class="drf-score-badge">{{ c.score }} match{{ "es" if c.score != 1 else "" }}</span>
                </label>
            </li>
        {% endfor %}
        </ul>
        <!-- row_ids is a comma-joined string of selected checkbox values, built by Alpine or JS -->
        <input type="hidden" name="row_ids" id="drf-row-ids-input" value="">
        <button
            type="submit"
            class="button button--primary"
            onclick="
                const checked = document.querySelectorAll('input[name=\"candidate_ids[]\"]:checked');
                document.getElementById('drf-row-ids-input').value =
                    Array.from(checked).map(el => el.value).join(',');
            ">
            Confirm Selected Linkages
        </button>
        <span id="drf-confirm-spinner" class="htmx-indicator" aria-label="Confirming">Confirming…</span>
    </form>
    {% else %}
    <p class="muted">No DRF linkages found that match the position's duties. Try reviewing the duty text or confirm manually.</p>
    {% endif %}
</div>
