<div id="drf-candidates-result" role="status" class="drf-confirmed-banner">
    <p>{{ confirmed_count }} DRF linkage(s) confirmed and stored.</p>
    <ul class="drf-confirmed-list">
    {% for link in drf_linkages %}
        <li>
            <strong>{{ link.core_responsibility }}</strong>:
            {{ link.departmental_result }}
            <span class="drf-fiscal-year">({{ link.fiscal_year }})</span>
        </li>
    {% endfor %}
    </ul>
    <p class="muted">These linkages will appear in the exported Work Description.</p>
</div>
